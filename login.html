<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jillian 💜</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    145deg,
                    #14071f,
                    #3b1760,
                    #180923
                );
        }

        .card {
            width: 100%;
            max-width: 380px;

            padding: 30px 25px;

            border-radius: 28px;

            background: #ffffff0d;
            border: 1px solid #ffffff18;

            box-shadow:
                0 20px 60px #00000050;

            text-align: center;
        }

        .heart {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 38px;
            color: #d59bff;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 30px;

            color: #cfc3d8;
            font-size: 13px;
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;

            padding: 11px;

            border: 1px solid #ffffff15;
            border-radius: 12px;

            background: #ffffff08;
            color: #cfc3d8;

            cursor: pointer;
        }

        .tab.active {
            background: #9c4ed0;
            color: white;
        }

        .field {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #d9cce4;
            font-size: 12px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ffffff18;
            border-radius: 14px;

            outline: none;

            background: #ffffff08;
            color: white;

            font-size: 14px;
        }

        input:focus {
            border-color: #b76bea;
        }

        .main-button {
            width: 100%;

            margin-top: 8px;
            padding: 14px;

            border: none;
            border-radius: 50px;

            background: #9c4ed0;
            color: white;

            font-size: 14px;
            cursor: pointer;
        }

        .main-button:active {
            transform: scale(.98);
        }

        .message {
            min-height: 20px;

            margin-top: 18px;

            color: #d9cce4;
            font-size: 12px;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        .small {
            margin-top: 20px;

            color: #9f91aa;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">💜</div>

        <h1>Jillian</h1>

        <p class="subtitle">
            Welcome to your little world. 💜
        </p>

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="showLogin()"
            >
                Login
            </button>

            <button
                class="tab"
                id="signupTab"
                onclick="showSignup()"
            >
                Create Account
            </button>

        </div>


        <!-- LOGIN -->

        <div id="loginForm">

            <div class="field">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Your email"
                    autocomplete="email"
                >

            </div>


            <div class="field">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="main-button"
                onclick="login()"
            >
                💜 Login
            </button>

          <button
    type="button"
    onclick="forgotPassword()"
    style="
        margin-top: 14px;
        background: none;
        border: none;
        color: #c99bea;
        font-size: 12px;
        cursor: pointer;
    "
>
    Forgot your password? 💜
          </button>

        </div>


        <!-- SIGN UP -->

        <div
            id="signupForm"
            class="hidden"
        >

            <div class="field">

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Your email"
                    autocomplete="email"
                >

            </div>


            <div class="field">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    autocomplete="new-password"
                >

            </div>


            <div class="field">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="signupConfirm"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                >

            </div>


            <button
                class="main-button"
                onclick="signup()"
            >
                💜 Create Account
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div class="small">
            Made with love 💜
        </div>

    </div>


<script>

    /* =====================================================
       SUPABASE CONNECTION
       ===================================================== */

    const SUPABASE_URL =
        "https://ffqaxhcuxnqzphzlkyww.supabase.co";


    /*
       IMPORTANT:

       Replace the text below with your
       SUPABASE PUBLISHABLE KEY.

       DO NOT use the sb_secret key.
    */

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_jPrQp0sn-jYxuUMkVaLTtw_SISaBZrd";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(text) {

        document.getElementById("message").textContent =
            text;

    }


    /* =====================================================
       SWITCH TO LOGIN
       ===================================================== */

    function showLogin() {

        document
            .getElementById("loginForm")
            .classList.remove("hidden");

        document
            .getElementById("signupForm")
            .classList.add("hidden");


        document
            .getElementById("loginTab")
            .classList.add("active");

        document
            .getElementById("signupTab")
            .classList.remove("active");


        showMessage("");

    }


    /* =====================================================
       SWITCH TO SIGN UP
       ===================================================== */

    function showSignup() {

        document
            .getElementById("loginForm")
            .classList.add("hidden");

        document
            .getElementById("signupForm")
            .classList.remove("hidden");


        document
            .getElementById("loginTab")
            .classList.remove("active");

        document
            .getElementById("signupTab")
            .classList.add("active");


        showMessage("");

    }


    /* =====================================================
       CREATE ACCOUNT
       ===================================================== */

    async function signup() {

        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("signupPassword")
                .value;

        const confirm =
            document
                .getElementById("signupConfirm")
                .value;


        if (!email || !password || !confirm) {

            showMessage(
                "Please fill in everything. 💜"
            );

            return;
        }


        if (password !== confirm) {

            showMessage(
                "The passwords do not match."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Your password must be at least 6 characters."
            );

            return;
        }


        showMessage(
            "Creating your account..."
        );


        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    emailRedirectTo:
                        "https://velascorogelio.github.io/Jill/"

                }

            });


        if (error) {

            showMessage(
                error.message
            );

            return;
        }


        /*
           Because Confirm email is ON,
           Supabase will send a confirmation email.
        */

        showMessage(
            "Account created! 💜 Check your email to confirm your account."
        );

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    async function login() {

        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("loginPassword")
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;
        }


        showMessage(
            "Logging you in... 💜"
        );


        const { data, error } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            showMessage(
                error.message
            );

            return;
        }


        showMessage(
            "Login successful! 💜"
        );


        /*
           Give Supabase a moment to save
           the session before opening the site.
        */

        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            700
        );

      /* =====================================================
       FORGOT PASSWORD
       ===================================================== */

    async function forgotPassword() {

        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();


        if (!email) {

            showMessage(
                "Enter your email first so we know where to send the recovery link. 💜"
            );

            return;
        }


        showMessage(
            "Sending your password recovery email... 📧💜"
        );


        const { error } =
            await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            "https://velascorogelio.github.io/Jill/reset-password.html"
                    }
                );


        if (error) {

            showMessage(
                error.message
            );

            return;
        }


        showMessage(
            "Recovery email sent! 📧💜 Check your inbox."
        );

            }

    }

</script>

</body>
</html>
