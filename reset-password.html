<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password 💜</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    #14071f,
                    #3b1760,
                    #180923
                );
        }


        .card {
            width: 100%;

            max-width: 380px;

            padding: 30px 25px;

            border-radius: 28px;

            background: #ffffff0d;

            border: 1px solid #ffffff18;

            box-shadow:
                0 20px 60px #00000050;

            text-align: center;
        }


        .heart {
            font-size: 45px;

            margin-bottom: 10px;
        }


        h1 {
            font-family: Georgia, serif;

            font-size: 34px;

            color: #d59bff;

            margin-bottom: 10px;
        }


        .subtitle {
            color: #cfc3d8;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        .field {
            text-align: left;

            margin-bottom: 15px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #d9cce4;

            font-size: 12px;
        }


        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #ffffff18;

            border-radius: 14px;

            outline: none;

            background: #ffffff08;

            color: white;

            font-size: 14px;
        }


        input:focus {
            border-color: #b76bea;
        }


        .main-button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;

            border-radius: 50px;

            background: #9c4ed0;

            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        .main-button:active {
            transform: scale(.98);
        }


        .message {
            min-height: 20px;

            margin-top: 18px;

            color: #d9cce4;

            font-size: 12px;

            line-height: 1.5;
        }


        .back {
            display: inline-block;

            margin-top: 20px;

            color: #c99bea;

            font-size: 12px;

            text-decoration: none;
        }


        .hidden {
            display: none;
        }

    </style>

</head>


<body>


    <div class="card">


        <div class="heart">
            💜
        </div>


        <h1>
            New Password
        </h1>


        <p class="subtitle">
            Let's give your little world a new key. 🔐💜
        </p>


        <div
            id="passwordForm"
            class="hidden"
        >


            <div class="field">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Create a new password"
                    autocomplete="new-password"
                >

            </div>


            <div class="field">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                >

            </div>


            <button
                type="button"
                class="main-button"
                onclick="updatePassword()"
            >
                💜 Change Password
            </button>


        </div>


        <div
            id="message"
            class="message"
        >
            Verifying your recovery link... 🔐💜
        </div>


        <a
            class="back"
            href="login.html"
        >
            ← Back to Login
        </a>


    </div>



<script>


    /* =====================================================
       SUPABASE CONNECTION
       ===================================================== */


    const SUPABASE_URL =
        "https://ffqaxhcuxnqzphzlkyww.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_jPrQp0sn-jYxuUMkVaLTtw_SISaBZrd";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    /* =====================================================
       MESSAGE
       ===================================================== */


    function showMessage(text) {

        document
            .getElementById("message")
            .textContent = text;

    }



    /* =====================================================
       SHOW PASSWORD FORM
       ===================================================== */


    function showPasswordForm() {

        document
            .getElementById("passwordForm")
            .classList
            .remove("hidden");


        showMessage(
            "Choose your new password. 🔐💜"
        );

    }



    /* =====================================================
       PASSWORD RECOVERY SESSION
       ===================================================== */


    const {
        data: authListener
    } =
        supabaseClient.auth
            .onAuthStateChange(
                (event, session) => {

                    if (
                        event ===
                        "PASSWORD_RECOVERY"
                    ) {

                        if (session) {

                            showPasswordForm();

                        } else {

                            showMessage(
                                "Recovery session could not be created. Please request a new password reset email."
                            );

                        }

                    }

                }
            );



    /* =====================================================
       CHECK EXISTING SESSION
       ===================================================== */


    async function checkRecoverySession() {

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth
                .getSession();


        if (session) {

            showPasswordForm();

        }

    }


    checkRecoverySession();



    /* =====================================================
       UPDATE PASSWORD
       ===================================================== */


    async function updatePassword() {


        const password =
            document
                .getElementById("newPassword")
                .value;


        const confirm =
            document
                .getElementById("confirmPassword")
                .value;


        if (
            !password ||
            !confirm
        ) {

            showMessage(
                "Please fill in both password fields. 💜"
            );

            return;

        }


        if (
            password !==
            confirm
        ) {

            showMessage(
                "The passwords do not match."
            );

            return;

        }


        if (
            password.length <
            6
        ) {

            showMessage(
                "Your password must be at least 6 characters."
            );

            return;

        }


        showMessage(
            "Changing your password... 🔐💜"
        );


        const {
            error
        } =
            await supabaseClient.auth
                .updateUser({

                    password:
                        password

                });


        if (error) {

            showMessage(
                error.message
            );

            return;

        }


        showMessage(
            "Password changed successfully! 💜"
        );


        setTimeout(
            async function() {

                await supabaseClient.auth
                    .signOut();


                window.location.href =
                    "login.html";

            },
            1500
        );

    }

</script>


</body>

</html>
