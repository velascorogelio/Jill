<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#08030d">

<title>Jillian — Connection</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}


body{
    font-family:Arial, sans-serif;
    color:white;
    background:#050208;
}


/* =====================================================
   MAIN SCREEN
===================================================== */

#screen{

    position:relative;

    width:100%;
    height:100svh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #35134d 0%,
            transparent 32%
        ),

        linear-gradient(
            145deg,
            #030107,
            #100417 50%,
            #050208
        );

    transition:
        opacity 1s ease,
        filter 1s ease,
        transform 1s ease;

}


/* =====================================================
   STARS
===================================================== */

#stars{

    position:absolute;
    inset:0;

    pointer-events:none;

}


.star{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 6px white;

    opacity:.4;

    animation:
        twinkle
        3s
        ease-in-out
        infinite;

}


@keyframes twinkle{

    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }

}


/* =====================================================
   GLOW
===================================================== */

.glow{

    position:absolute;

    width:420px;
    height:420px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #a84dde30,
            transparent 68%
        );

    filter:blur(30px);

    animation:
        breathe
        8s
        ease-in-out
        infinite;

}


@keyframes breathe{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.85);

        opacity:.5;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.15);

        opacity:.9;
    }

}


/* =====================================================
   ORBIT
===================================================== */

.orbit{

    position:absolute;

    width:min(75vw,480px);
    height:min(75vw,480px);

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border:
        1px solid #d99aff18;

    border-radius:50%;

    animation:
        rotate
        30s
        linear
        infinite;

}


@keyframes rotate{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}


/* =====================================================
   CONTENT
===================================================== */

.content{

    position:relative;

    z-index:5;

    width:min(88%,400px);

    text-align:center;

    padding:20px;

}


/* =====================================================
   TOP TEXT
===================================================== */

.connection{

    margin-bottom:22px;

    color:#bf91d7;

    font-size:9px;

    letter-spacing:4px;

    text-transform:uppercase;

    animation:
        fadeUp
        1s
        .2s
        both;

}


/* =====================================================
   HEART
===================================================== */

.heart{

    font-size:45px;

    margin-bottom:12px;

    filter:
        drop-shadow(
            0 0 25px #b75bea
        );

    animation:
        heartIn
        1s
        .4s
        both;

}


@keyframes heartIn{

    from{
        opacity:0;
        transform:
            scale(.3)
            rotate(-15deg);
        filter:blur(8px);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            rotate(0);
        filter:
            blur(0)
            drop-shadow(
                0 0 25px #b75bea
            );
    }

}


/* =====================================================
   NAME
===================================================== */

h1{

    font-family:Georgia,serif;

    font-size:
        clamp(
            48px,
            14vw,
            72px
        );

    line-height:.9;

    color:#e1a7ff;

    text-shadow:
        0 0 30px #b65ce866;

    animation:
        titleIn
        1.2s
        .8s
        both;

}


@keyframes titleIn{

    from{
        opacity:0;
        transform:
            translateY(20px)
            scale(.95);
        filter:blur(8px);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
        filter:blur(0);
    }

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle{

    margin-top:18px;

    color:#d0c2d8;

    font-size:13px;

    line-height:1.8;

    animation:
        fadeUp
        1s
        1.3s
        both;

}


.subtitle strong{

    color:#e3b3ff;

}


/* =====================================================
   ACCESS
===================================================== */

.access{

    margin-top:25px;

    animation:
        fadeUp
        1s
        1.8s
        both;

}


.label{

    margin-bottom:10px;

    color:#95849d;

    font-size:9px;

    letter-spacing:3px;

    text-transform:uppercase;

}


/* =====================================================
   INPUT
===================================================== */

#birthdate{

    width:100%;

    height:55px;

    padding:0 18px;

    border-radius:50px;

    border:
        1px solid
        rgba(210,150,255,.35);

    outline:none;

    background:
        rgba(255,255,255,.08);

    color:white;

    text-align:center;

    font-size:15px;

    color-scheme:dark;

    box-shadow:
        inset 0 0 20px
        rgba(255,255,255,.03),

        0 0 25px
        rgba(174,82,230,.10);

}


#birthdate:focus{

    border-color:#c47bea;

    box-shadow:
        0 0 25px
        rgba(174,82,230,.25);

}


/* =====================================================
   BUTTON
===================================================== */

#unlock{

    width:100%;

    height:54px;

    margin-top:12px;

    border:none;

    border-radius:50px;

    background:
        linear-gradient(
            110deg,
            #7434a2,
            #b85de7,
            #7434a2
        );

    background-size:200% 100%;

    color:white;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 12px 40px
        rgba(157,72,208,.3);

    animation:
        gradientMove
        5s
        ease-in-out
        infinite;

    transition:
        transform .2s ease,
        box-shadow .3s ease;

}


@keyframes gradientMove{

    0%,100%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

}


#unlock:hover{

    transform:translateY(-2px);

    box-shadow:
        0 16px 45px
        rgba(169,78,232,.5);

}


#unlock:active{

    transform:scale(.97);

}


/* =====================================================
   MESSAGE
===================================================== */

#message{

    min-height:18px;

    margin-top:12px;

    color:#ad9bb6;

    font-size:11px;

}


/* =====================================================
   ERROR
===================================================== */

.shake{

    animation:
        shake
        .4s
        ease;

}


@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-7px);
    }

    50%{
        transform:translateX(7px);
    }

    75%{
        transform:translateX(-4px);
    }

}


/* =====================================================
   SUCCESS OVERLAY
===================================================== */

#success{

    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(5,1,10,.75);

    opacity:0;

    visibility:hidden;

    transition:
        opacity .8s ease,
        visibility .8s ease;

}


/* =====================================================
   SUCCESS CARD
===================================================== */

.success-card{

    width:min(100%,390px);

    padding:40px 25px;

    text-align:center;

    border-radius:28px;

    border:
        1px solid
        rgba(215,165,255,.3);

    background:
        rgba(24,7,35,.96);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.7),

        0 0 70px
        rgba(177,76,235,.18);

    transform:
        translateY(25px)
        scale(.94);

    opacity:0;

    transition:
        transform .8s
        cubic-bezier(.16,1,.3,1),

        opacity .8s ease;

}


#success.show{

    opacity:1;

    visibility:visible;

}


#success.show
.success-card{

    transform:
        translateY(0)
        scale(1);

    opacity:1;

}


/* =====================================================
   SUCCESS CONTENT
===================================================== */

.success-heart{

    font-size:45px;

    margin-bottom:18px;

    filter:
        drop-shadow(
            0 0 25px #b75bea
        );

}


.success-label{

    color:#c99bea;

    font-size:9px;

    letter-spacing:4px;

    text-transform:uppercase;

}


.success-card h2{

    margin-top:15px;

    font-family:Georgia,serif;

    font-size:
        clamp(
            42px,
            12vw,
            62px
        );

    color:#e1a7ff;

    text-shadow:
        0 0 30px #b65ce866;

}


.success-card p{

    margin-top:18px;

    color:#d3c5da;

    font-size:13px;

    line-height:1.8;

}


.success-card strong{

    color:#e3b3ff;

}


/* =====================================================
   CONTINUE
===================================================== */

#continue{

    display:flex;

    align-items:center;
    justify-content:center;

    width:100%;

    height:54px;

    margin-top:27px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #b85de7,
            #7131a0
        );

    color:white;

    text-decoration:none;

    font-size:12px;

    font-weight:bold;

    box-shadow:
        0 15px 45px
        rgba(169,78,232,.4);

    transition:
        transform .2s ease,
        box-shadow .3s ease;

}


#continue:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 18px 55px
        rgba(169,78,232,.6);

}


/* =====================================================
   BACKGROUND WHEN UNLOCKED
===================================================== */

#screen.fade{

    opacity:.25;

    filter:blur(6px);

    transform:scale(1.03);

}


/* =====================================================
   GENERAL ANIMATION
===================================================== */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   MOBILE HEIGHT
===================================================== */

@media(max-height:650px){

    .content{
        transform:scale(.85);
    }

}

</style>

</head>


<body>


<!-- =====================================================
     MAIN SCREEN
===================================================== -->

<div id="screen">


    <div id="stars"></div>


    <div class="glow"></div>


    <div class="orbit"></div>


    <main class="content">


        <div class="connection">

            Connection established...

        </div>


        <div class="heart">

            💜

        </div>


        <h1>

            Jillian

        </h1>


        <p class="subtitle">

            Welcome, Jillian.

            <br><br>

            Your
            <strong>BABYY</strong>
            made something for you.

        </p>


        <div class="access">


            <div class="label">

                Enter your secret key

            </div>


            <input
                type="date"
                id="birthdate"
            >


            <button
                id="unlock"
                type="button"
            >

                UNLOCK CONNECTION

            </button>


            <div id="message"></div>


        </div>


    </main>

</div>



<!-- =====================================================
     SUCCESS
===================================================== -->

<div id="success">


    <div class="success-card">


        <div class="success-heart">

            🔓💜

        </div>


        <div class="success-label">

            Access granted

        </div>


        <h2>

            You're in.

        </h2>


        <p>

            The connection is secure.

            <br><br>

            <strong>
                Your little universe is waiting.
            </strong>

        </p>


        <a
            id="continue"
            href="universe.html"
        >

            CONTINUE ✦

        </a>


    </div>


</div>



<script>

/* =====================================================
   STARS
===================================================== */

const stars =
    document.getElementById("stars");


for(let i = 0; i < 100; i++){

    const star =
        document.createElement("div");


    star.className =
        "star";


    const size =
        Math.random() * 2 + .5;


    star.style.width =
        size + "px";


    star.style.height =
        size + "px";


    star.style.left =
        Math.random() * 100 + "%";


    star.style.top =
        Math.random() * 100 + "%";


    star.style.animationDuration =
        (2 + Math.random() * 5) + "s";


    star.style.animationDelay =
        (-Math.random() * 5) + "s";


    stars.appendChild(star);

}


/* =====================================================
   SECRET
===================================================== */

const SECRET_BIRTHDATE =
    "2009-09-29";


/* =====================================================
   ELEMENTS
===================================================== */

const birthdate =
    document.getElementById(
        "birthdate"
    );


const unlock =
    document.getElementById(
        "unlock"
    );


const message =
    document.getElementById(
        "message"
    );


const screen =
    document.getElementById(
        "screen"
    );


const success =
    document.getElementById(
        "success"
    );


/* =====================================================
   UNLOCK FUNCTION
===================================================== */

function checkPassword(){

    const value =
        birthdate.value;


    /* EMPTY */

    if(!value){

        message.textContent =
            "Enter the secret key first. 💜";

        birthdate.classList.remove(
            "shake"
        );

        void birthdate.offsetWidth;

        birthdate.classList.add(
            "shake"
        );

        return;

    }


    /* WRONG */

    if(
        value !==
        SECRET_BIRTHDATE
    ){

        message.textContent =
            "Connection rejected. Try again. 💜";

        birthdate.classList.remove(
            "shake"
        );

        void birthdate.offsetWidth;

        birthdate.classList.add(
            "shake"
        );

        return;

    }


    /* =================================================
       CORRECT
    ================================================= */

    message.textContent =
        "";


    unlock.disabled =
        true;


    unlock.textContent =
        "ACCESS GRANTED ✓";


    /* Fade the original screen */

    screen.classList.add(
        "fade"
    );


    /* Show success card */

    setTimeout(function(){

        success.classList.add(
            "show"
        );

    },500);

}


/* =====================================================
   CLICK
===================================================== */

unlock.addEventListener(
    "click",
    checkPassword
);


/* =====================================================
   ENTER KEY
===================================================== */

birthdate.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            checkPassword();

        }

    }
);

</script>


</body>

</html>
